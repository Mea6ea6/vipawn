<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/x-icon/x-icon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./pages/market.css" />
    <title>Market</title>
</head>
<body class="background">
    <div class="page">
        <header class="header">
            <div class="header__container">
                <button class="header__burger" type="button">
                    <span class="header__burger-layer"></span>
                    <span class="header__burger-layer"></span>
                    <span class="header__burger-layer"></span>
                </button>
                <a class="header__home-link" href="#">
                    <img class="header__home-icon" src="./images/header/__logo.svg" alt="vipawn">
                </a>
                <form class="header__search-bar" action="get">
                    <button class="header__search-btn" type="submit">
                        <img class="header__search-icon" src="./images/header/__search-icon.svg" alt="search">
                    </button>
                    <input class="header__search-input" type="text" placeholder="Search">
                </form>
                <a class="header__link-loans" href="#">Loans
                    <img class="header__link-icon" src="./images/header/__loans.svg" alt="loans">
                </a>
                <a class="header__link-pawn" href="#">Pawn
                    <img class="header__link-icon" src="./images/header/__pawn.svg" alt="pawn">                
                </a>
                <button class="header__profile" type="button">
                    <img class="header__profile-icon" src="./images/header/__profile.svg" alt="profile">
                </button>
            </div>
            <div class="header__burger-menu">
                <div class="header__burger-container">
                    <div class="header__burger-item header__burger-item_list">
                        <div class="header__burger-page-btn header__burger-page-btn_list">
                            <img class="header__burger-page-img" src="./images/header/__home.svg" alt="home">
                            <p class="header__burger-page-title">Home</p>
                            <div class="header__burger-page-icon"></div>
                        </div>
                        <div class="header__burger-list">
                            <a class="header__burger-list-link" href="#novelties">
                                New Arrivals
                                <span class="header__burger-list-span">67</span>
                            </a>
                            <a class="header__burger-list-link" href="#featured">
                                Featured
                                <span class="header__burger-list-span">124</span>
                            </a>
                            <a class="header__burger-list-link" href="#faq">
                                FAQs
                            </a>
                            <a class="header__burger-list-link" href="#contact">
                                Contacts
                            </a>
                        </div>
                    </div>
                    <div class="header__burger-item">
                        <a class="header__burger-page-btn" href="#">
                            <img class="header__burger-page-img" src="./images/header/__market.svg" alt="market">
                            <p class="header__burger-page-title">Market</p>
                        </a>
                    </div>
                    <div class="header__burger-item">
                        <a class="header__burger-page-btn" href="#">
                            <img class="header__burger-page-img" src="./images/header/__pawn-burger.svg" alt="pawn">
                            <p class="header__burger-page-title">Pawn</p>
                            <span class="header__burger-page-span">Sell your item</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <main class="content">
            <section class="catalog">
                <div class="catalog__navigation">
                    <nav class="catalog__breadcrumbs">
                        <a class="catalog__breadcrumb" href="#">Market</a>
                        <span class="catalog__breadcrumbs-span">•</span>
                        <a class="catalog__breadcrumb" href="#">Watches</a>
                        <span class="catalog__breadcrumbs-span">•</span>
                        <a class="catalog__breadcrumb" href="#">Men's watches</a>
                    </nav>
                    <h2 class="catalog__title">Rolex Watches</h2>
                    <div class="catalog__filters-tags">
                        <button class="catalog__filters-tag">
                            Rolex
                        </button>
                        <button class="catalog__filters-tag">
                            Sales
                        </button>
                        <button class="catalog__filters-tag">
                            Cartier
                        </button>
                        <button class="catalog__filters-tag">
                            Gold watches
                        </button>
                        <button class="catalog__filters-tag">
                            For men
                        </button>
                        <button class="catalog__filters-tag">
                            Designers
                        </button>
                        <button class="catalog__filters-tag">
                            Omega
                        </button>
                        <button class="catalog__filters-tag">
                            Brilliants
                        </button>
                        <button class="catalog__filters-tag">
                            Jewerly
                        </button>
                        <button class="catalog__filters-tag">
                            For kids
                        </button>
                        <button class="catalog__filters-tag">
                            Split
                        </button>
                        <button class="catalog__filters-tag">
                            Popular
                        </button>
                        <button class="catalog__filters-tag">
                            Silver bracelets
                        </button>
                    </div>
                </div>
                <!-- Продолжать тут -->
            </section>
        </main>

        <footer class="footer">
            <div class="footer__container">
                <div class="footer__links">
                    <a class="footer__link" href="#">Terms and conditions</a>
                    <a class="footer__link" href="#">Privacy Policy</a>
                </div>
                <p class="footer__copyright">Copyright © 2025 / All Rights Reserved / Made by <span class="footer__copyright-span">SURGE</span></p>
                <div class="footer__socials">
                    <a class="footer__social" href="#">Instagram</a>
                    <a class="footer__social" href="#">Facebook</a>
                    <a class="footer__social" href="#">Telegram</a>
                </div>
            </div>
        </footer>
    </div>
</body>
<script src="./pages/market.js"></script>
</html>
